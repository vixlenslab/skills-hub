    <script>
      /* aplica tema antes do render p/ evitar flash */
      (function () {
        try {
          var t = localStorage.getItem('vix-theme')
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
