<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #222;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f5f5f5;
    --text2: #d0d0d0;
    --text3: #8a8a8a;
    --accent: #f97316;
    --accent-dim: rgba(249,115,22,0.12);
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }

  :root.light {
    --bg: #fafafa;
    --bg2: #f0f0f0;
    --bg3: #e8e8e8;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #111;
    --text2: #444;
    --text3: #888;
  }

  .theme-toggle {
    margin-left: auto;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text2);
    cursor: pointer;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0; padding: 0;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--accent); }
  .theme-toggle svg { width: 15px; height: 15px; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 13px;
    color: var(--text2);
  }

  .controls {
    padding: 20px 32px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }

  input[type="text"] {
    width: 100%;
    padding: 9px 12px 9px 36px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
    user-select: none;
  }

  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats-bar {
    padding: 12px 32px;
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }

  .stats-bar span strong { color: var(--text2); font-weight: 500; }

  .count { margin-left: auto; }

  .grid {
    padding: 24px 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s, transform 0.1s;
    cursor: default;
  }

  .card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .card-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: var(--text);
  }

  .cat-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;

    flex-shrink: 0;

  .cat-Design { background: rgba(139,92,246,0.15); color: #a78bfa; }
  .cat-Escrita { background: rgba(52,211,153,0.15); color: #34d399; }
  .cat-Plugin { background: rgba(249,115,22,0.15); color: var(--accent); }
  .cat-Nativa { background: rgba(156,163,175,0.12); color: #9ca3af; }

  .cmd {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg3);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: background 0.15s;
  }

  .cmd:hover { background: var(--accent-dim); }

  .cmd svg { width: 12px; height: 12px; flex-shrink: 0; }

  .desc {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
  }

  .copied-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }

  .copied-toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 0;
    color: var(--text3);
    font-size: 14px;
  }

  .section-label {
    grid-column: 1/-1;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 8px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  @media (max-width: 768px) {
    .stats-bar { flex-wrap: wrap; gap: 8px; }
    .count { margin-left: 0; width: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

  @media (max-width: 600px) {
    header { padding: 14px 16px; gap: 10px; }
    header h1 { font-size: 15px; }
    header p { font-size: 12px; }
    .logo { width: 30px; height: 30px; font-size: 15px; }
    .controls { padding: 12px 16px; flex-direction: column; gap: 8px; }
    .search-wrap { min-width: unset; }
    .filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .pill { white-space: nowrap; padding: 7px 14px; }
    .stats-bar { padding: 10px 16px; font-size: 11px; gap: 8px; }
    .grid { padding: 14px 16px 24px; grid-template-columns: 1fr; gap: 8px; }
    .card { padding: 14px; }
    .cmd { font-size: 11px; padding: 5px 10px; }
    .desc { font-size: 12px; }
    .copied-toast { left: 16px; right: 16px; text-align: center; border-radius: 10px; }
  }
</style>
</head>

const TMOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function syncThemeBtns() {
  const light = document.documentElement.classList.contains('light');
  document.querySelectorAll('.theme-toggle').forEach(b => b.innerHTML = light ? TMOON : TSUN);
}
function toggleTheme() {
  const light = !document.documentElement.classList.contains('light');
  document.documentElement.classList.toggle('light', light);
  localStorage.setItem('vix-theme', light ? 'light' : 'dark');
  syncThemeBtns();
}
syncThemeBtns();
document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', toggleTheme));

const cmdOverride = {
  "claude-mem": "npx claude-mem start",
  "caveman": "/caveman",
};

const cats = ["Todas", "Marketing", "Design", "Escrita", "Plugin", "Nativa"];
let activeCat = "Todas";

function buildFilters() {
  const wrap = document.getElementById('filters');
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (cat === activeCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      activeCat = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      filter();
    };
    wrap.appendChild(btn);
  });
}

function copyCmd(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  });
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const cat = activeCat === 'Todas' ? '' : activeCat;
  const filtered = skills.filter(([name, c, desc]) => {
    const matchQ = !q || name.includes(q) || desc.toLowerCase().includes(q);
    const matchC = !cat || c === cat;
    return matchQ && matchC;
  });
  renderGrid(filtered);
}

function renderGrid(data) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (!data.length) {
    grid.innerHTML = '<div class="empty">Nenhuma skill encontrada.</div>';
    document.getElementById('countLabel').textContent = '0 skills';
    return;
  }

  const groups = {};
  data.forEach(s => {
    if (!groups[s[1]]) groups[s[1]] = [];
    groups[s[1]].push(s);
  });

  const order = ['Marketing', 'Design', 'Escrita', 'Plugin', 'Nativa'];
  order.forEach(cat => {
    if (!groups[cat]) return;
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = cat + ' · ' + groups[cat].length;
    grid.appendChild(label);

    groups[cat].forEach(([name, cat, desc]) => {
      const cmd = cmdOverride[name] || '/' + name;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="card-name">${name}</span>
          <span class="cat-badge cat-${cat}">${cat}</span>
        </div>
        <div class="cmd" onclick="copyCmd('${cmd}')" title="Clique para copiar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          ${cmd}
        </div>
        <div class="desc">${desc}</div>
      `;
      grid.appendChild(card);
    });
  });

  document.getElementById('countLabel').textContent = data.length + ' skills';
}

buildFilters();
filter();
